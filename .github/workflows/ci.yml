name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      FOREST_UI_SAMPLE_CAPTURE: none
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_mingw'
          tools: 'tools_mingw,qt.tools.win64_mingw1120'
      - name: Configure
        shell: pwsh
        run: |
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw1120_64/bin/g++.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Matching Qt MinGW compiler is missing.' }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DCMAKE_CXX_COMPILER=$compiler"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package smoke test
        shell: pwsh
        run: ./scripts/package_portable.ps1 -BuildDir build -SmokeTest
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-qa-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build/ui-fullscreen-snapshots/manifest.txt
            build/ui-smoke-results.txt
            build/Testing/Temporary/LastTest.log
            artifacts/**/*.zip
